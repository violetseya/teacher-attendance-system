<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1220" />
  <title>教师端考勤系统</title>
  <style>
    :root{--bg:#0a101c;--side:#0d1626;--panel:#111d30;--panel2:#15243a;--line:rgba(171,194,225,.14);--text:#f3f7ff;--muted:#9aa9bf;--faint:#687890;--mint:#77e2c0;--blue:#8aa7ff;--yellow:#f5cf72;--red:#ff919b;--shadow:0 24px 70px rgba(0,0,0,.25);--r:18px}
    *{box-sizing:border-box}html{background:var(--bg)}body{margin:0;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(circle at 74% 0%,rgba(82,119,255,.13),transparent 32%),linear-gradient(145deg,#0b1220 0%,#080d17 100%);min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{min-height:100vh;display:grid;grid-template-columns:250px minmax(0,1fr)}
    .sidebar{background:rgba(9,16,29,.82);border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:25px}.brand{display:flex;align-items:center;gap:11px;padding:0 8px}.brand-mark{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#07121a;font-weight:900;background:linear-gradient(135deg,var(--mint),#b3ffec)}.brand strong{display:block;font-size:15px;letter-spacing:-.02em}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.teacher{display:flex;gap:10px;align-items:center;padding:13px 11px;border-radius:15px;background:rgba(255,255,255,.045);border:1px solid var(--line)}.teacher-avatar{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:#2e4071;color:#d8e0ff;font-weight:800}.teacher strong{display:block;font-size:13px}.teacher small{display:block;color:var(--faint);font-size:11px;margin-top:3px}.nav{display:grid;gap:5px}.nav button{display:flex;align-items:center;gap:11px;color:var(--muted);background:transparent;border-radius:11px;padding:11px 12px;text-align:left;font-size:13px;transition:.2s}.nav button:hover{color:var(--text);background:rgba(255,255,255,.05)}.nav button.active{color:var(--mint);background:rgba(119,226,192,.1)}.nav i{font-style:normal;width:18px;text-align:center;font-size:16px}.side-foot{margin-top:auto;color:var(--faint);font-size:11px;line-height:1.6;padding:0 8px}.main{min-width:0;padding:27px 34px 40px;max-width:1500px;width:100%;margin:0 auto}.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:26px}.eyebrow{font-size:11px;color:var(--mint);letter-spacing:.14em;font-weight:800;text-transform:uppercase}.topbar h1{font-size:30px;letter-spacing:-.05em;margin:7px 0 6px}.topbar p{color:var(--muted);font-size:13px;margin:0}.top-actions{display:flex;align-items:center;gap:10px}.private{font-size:11px;color:var(--mint);padding:9px 11px;border:1px solid rgba(119,226,192,.24);border-radius:10px;background:rgba(119,226,192,.06)}.primary,.ghost,.danger{border-radius:11px;padding:10px 14px;font-size:13px;font-weight:800;transition:.2s}.primary{color:#07121a;background:var(--mint);box-shadow:0 8px 22px rgba(119,226,192,.15)}.primary:hover{transform:translateY(-1px);box-shadow:0 12px 28px rgba(119,226,192,.24)}.ghost{color:var(--text);background:rgba(255,255,255,.05);border:1px solid var(--line)}.ghost:hover{background:rgba(255,255,255,.1)}.danger{color:var(--red);background:rgba(255,145,155,.08);border:1px solid rgba(255,145,155,.15)}
    .view{display:grid;gap:18px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:linear-gradient(145deg,rgba(20,33,55,.86),rgba(14,23,39,.9));border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}.metric{padding:19px 20px;position:relative;overflow:hidden}.metric:after{content:"";width:100px;height:100px;border:1px solid rgba(119,226,192,.12);border-radius:50%;position:absolute;right:-39px;top:-41px}.metric label{color:var(--muted);font-size:12px}.metric strong{display:block;font-size:30px;letter-spacing:-.05em;margin-top:10px}.metric span{color:var(--faint);font-size:11px;margin-top:6px;display:block}.metric.mint strong{color:var(--mint)}.metric.yellow strong{color:var(--yellow)}.metric.red strong{color:var(--red)}
    .section{padding:20px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:16px}.section-head h2{font-size:16px;margin:0;letter-spacing:-.02em}.section-head p{color:var(--muted);font-size:12px;margin:4px 0 0}.section-head .right{display:flex;gap:8px;align-items:center}.grid-2{display:grid;grid-template-columns:1.3fr .7fr;gap:18px}.course-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.course-card{padding:16px;border:1px solid rgba(171,194,225,.1);border-radius:14px;background:rgba(255,255,255,.025)}.course-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.course-code{font-size:11px;color:var(--blue);font-weight:800;letter-spacing:.08em}.course-card h3{font-size:16px;margin:7px 0 0}.course-meta{color:var(--muted);font-size:12px;line-height:1.8;margin-top:11px}.course-meta b{color:var(--text);font-weight:600}.badge{display:inline-flex;align-items:center;padding:5px 8px;border-radius:20px;background:rgba(255,255,255,.06);color:var(--muted);font-size:11px}.badge.mint{color:var(--mint);background:rgba(119,226,192,.1)}.badge.yellow{color:var(--yellow);background:rgba(245,207,114,.1)}.badge.red{color:var(--red);background:rgba(255,145,155,.1)}.list{display:grid;gap:8px}.list-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 12px;border-radius:12px;background:rgba(255,255,255,.035)}.list-row strong{font-size:13px}.list-row small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.list-right{text-align:right;color:var(--muted);font-size:11px}.status-1{color:var(--mint)}.status-2{color:var(--yellow)}.status-3{color:var(--red)}
    .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.search{position:relative;min-width:240px;flex:1}.search span{position:absolute;left:13px;top:10px;color:var(--faint)}.search input,.field input,.field select,.field textarea,.toolbar select{width:100%;border:1px solid var(--line);border-radius:10px;color:var(--text);background:rgba(4,9,18,.4);outline:none;padding:10px 12px}.search input{padding-left:35px}.search input:focus,.field input:focus,.field select:focus,.field textarea:focus,.toolbar select:focus{border-color:rgba(119,226,192,.6);box-shadow:0 0 0 3px rgba(119,226,192,.08)}.toolbar select{width:auto;min-width:138px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:740px}.table th{color:var(--faint);font-size:11px;font-weight:600;text-align:left;padding:0 10px 11px}.table td{border-top:1px solid rgba(171,194,225,.1);padding:13px 10px;font-size:13px;vertical-align:middle}.table td small{color:var(--muted);font-size:11px;display:block;margin-top:4px}.table .actions{white-space:nowrap}.table .actions button{margin-left:5px}.name-cell{display:flex;align-items:center;gap:9px}.name-avatar{width:31px;height:31px;border-radius:10px;display:grid;place-items:center;background:#28375f;color:#dce4ff;font-size:11px;font-weight:800}.empty{padding:35px;text-align:center;color:var(--faint);font-size:13px}.view-title{display:flex;justify-content:space-between;align-items:end;gap:14px}.view-title h2{font-size:20px;letter-spacing:-.04em;margin:0}.view-title p{color:var(--muted);font-size:12px;margin:6px 0 0}
    .batch-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.batch{padding:17px;border-radius:15px;background:rgba(255,255,255,.035);border:1px solid var(--line)}.batch-top{display:flex;justify-content:space-between;gap:8px}.batch h3{font-size:15px;margin:8px 0 0}.batch p{color:var(--muted);font-size:12px;margin:8px 0 0}.batch-stats{display:flex;gap:14px;margin-top:16px}.batch-stats div{color:var(--faint);font-size:11px}.batch-stats b{display:block;color:var(--text);font-size:18px;margin-bottom:3px}
    .er-shell{padding:15px 0 0;overflow:auto}.er-svg{min-width:960px;width:100%;height:620px}.er-box{fill:#111d30;stroke:#7691ae;stroke-width:1.5}.er-head{fill:#193754;stroke:#7bb6c8;stroke-width:1.5}.er-title{fill:#f3f7ff;font-size:18px;font-weight:800;text-anchor:middle}.er-field{fill:#bdcde0;font-size:14px}.er-key{fill:#77e2c0;font-size:12px;font-weight:800}.er-line{stroke:#7e9ab8;stroke-width:1.5;fill:none}.er-label{fill:#9aa9bf;font-size:13px;text-anchor:middle}.er-card{fill:#f7cf73;font-size:12px;font-weight:800}.schema-note{color:var(--muted);font-size:12px;line-height:1.7;margin:8px 0 0}
    .modal-back{position:fixed;inset:0;background:rgba(1,5,12,.72);display:grid;place-items:center;padding:20px;z-index:30}.modal{width:min(520px,100%);background:#142238;border:1px solid var(--line);border-radius:20px;box-shadow:0 30px 100px rgba(0,0,0,.45);padding:22px}.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:start;margin-bottom:17px}.modal h2{margin:0;font-size:18px}.modal-head p{color:var(--muted);font-size:12px;margin:5px 0 0}.close{color:var(--muted);background:transparent;font-size:22px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:grid;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:var(--muted)}.field textarea{min-height:76px;resize:vertical}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.toast{position:fixed;left:50%;bottom:25px;transform:translate(-50%,18px);opacity:0;pointer-events:none;background:var(--mint);color:#07121a;font-weight:800;font-size:13px;padding:11px 15px;border-radius:10px;transition:.2s;z-index:40}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:1100px){.app{grid-template-columns:220px 1fr}.main{padding:24px}.cards{grid-template-columns:repeat(2,1fr)}.grid-2{grid-template-columns:1fr}.batch-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:720px){.app{display:block}.sidebar{position:static;padding:15px;gap:14px;border-right:0;border-bottom:1px solid var(--line)}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.side-foot{display:none}.main{padding:20px 14px 30px}.topbar{display:block}.top-actions{margin-top:17px;justify-content:space-between}.topbar h1{font-size:26px}.course-grid,.batch-grid{grid-template-columns:1fr}.cards{gap:9px}.metric{padding:15px}.metric strong{font-size:25px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.er-shell{margin:0 -5px}.er-svg{height:600px}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark">考</div><div><strong>教师端考勤</strong><small>Teacher attendance</small></div></div>
      <div class="teacher"><div class="teacher-avatar">林</div><div><strong id="teacherName">林老师</strong><small>私有教师工作台</small></div></div>
      <nav class="nav" id="nav" aria-label="主导航"><button class="active" data-view="overview"><i>⌂</i>课堂概览</button><button data-view="courses"><i>▣</i>课程管理</button><button data-view="students"><i>♙</i>学生信息</button><button data-view="batches"><i>◷</i>点名批次</button><button data-view="attendance"><i>✓</i>考勤记录</button><button data-view="er"><i>◇</i>数据结构 ER 图</button></nav>
      <div class="side-foot">本系统仅供教师使用<br/>学生姓名以学生信息表为唯一来源</div>
    </aside>
    <main class="main"><header class="topbar"><div><div class="eyebrow">TEACHER WORKSPACE / 2026</div><h1 id="pageTitle">课堂概览</h1><p id="pageSubtitle">查看课程、点名批次和近期考勤情况</p></div><div class="top-actions"><div class="private">● 仅教师可用</div><button class="primary" id="globalAdd">＋ 新建记录</button></div></header><div id="appView"></div></main>
  </div>
  <div id="modalRoot"></div><div class="toast" id="toast"></div>
  <script>
    const KEY='teacher-attendance-structure-v1';
    const old=JSON.parse(localStorage.getItem('class-roll-call-v1')||'null');
    const oldStudents=old?.people?.map((p,i)=>({uuid:`student-${String(i+1).padStart(3,'0')}`,courseUuid:'course-101',studentNo:`2026${String(i+1).padStart(4,'0')}`,name:p.name,phone:''}))||[];
    const seedStudents=oldStudents.length?oldStudents:[{uuid:'student-001',courseUuid:'course-101',studentNo:'20260001',name:'林晓晴',phone:'13800010001'},{uuid:'student-002',courseUuid:'course-101',studentNo:'20260002',name:'周子谦',phone:'13800010002'},{uuid:'student-003',courseUuid:'course-101',studentNo:'20260003',name:'陈思远',phone:'13800010003'},{uuid:'student-004',courseUuid:'course-101',studentNo:'20260004',name:'许安然',phone:'13800010004'},{uuid:'student-005',courseUuid:'course-102',studentNo:'20260005',name:'沈嘉树',phone:'13800010005'},{uuid:'student-006',courseUuid:'course-102',studentNo:'20260006',name:'王一诺',phone:'13800010006'},{uuid:'student-007',courseUuid:'course-102',studentNo:'20260007',name:'赵梓涵',phone:'13800010007'},{uuid:'student-008',courseUuid:'course-103',studentNo:'20260008',name:'李沐阳',phone:'13800010008'},{uuid:'student-009',courseUuid:'course-103',studentNo:'20260009',name:'何雨珊',phone:'13800010009'},{uuid:'student-010',courseUuid:'course-103',studentNo:'20260010',name:'郭文博',phone:'13800010010'}];
    const seed={teacher:{uuid:'teacher-001',teacherNo:'T2026001',name:'林老师',password:'••••••••',email:'teacher@example.com'},courses:[{uuid:'course-101',teacherUuid:'teacher-001',courseNo:'MATH-101',name:'高等数学 A',semester:'2026 春',classroom:'A302',schedule:'周二 08:00—09:40'},{uuid:'course-102',teacherUuid:'teacher-001',courseNo:'DATA-201',name:'数据结构',semester:'2026 春',classroom:'B201',schedule:'周三 14:00—15:40'},{uuid:'course-103',teacherUuid:'teacher-001',courseNo:'STAT-105',name:'统计学基础',semester:'2026 春',classroom:'C106',schedule:'周五 10:00—11:40'}],students:seedStudents,batches:[{uuid:'batch-001',courseUuid:'course-101',name:'第 8 次课点名',date:'2026-11-24',mode:'随机点名',status:'已完成'},{uuid:'batch-002',courseUuid:'course-102',name:'第 7 次课点名',date:'2026-11-23',mode:'按顺序',status:'已完成'},{uuid:'batch-003',courseUuid:'course-103',name:'第 6 次课点名',date:'2026-11-21',mode:'随机点名',status:'已完成'}],attendance:[{uuid:'att-001',studentUuid:'student-001',batchUuid:'batch-001',status:1,remark:'',recordedAt:'2026-11-24 08:16'},{uuid:'att-002',studentUuid:'student-002',batchUuid:'batch-001',status:2,remark:'病假',recordedAt:'2026-11-24 08:16'},{uuid:'att-003',studentUuid:'student-003',batchUuid:'batch-001',status:1,remark:'',recordedAt:'2026-11-24 08:16'},{uuid:'att-004',studentUuid:'student-004',batchUuid:'batch-001',status:3,remark:'未到课',recordedAt:'2026-11-24 08:16'},{uuid:'att-005',studentUuid:'student-005',batchUuid:'batch-002',status:1,remark:'',recordedAt:'2026-11-23 14:15'},{uuid:'att-006',studentUuid:'student-006',batchUuid:'batch-002',status:3,remark:'',recordedAt:'2026-11-23 14:15'},{uuid:'att-007',studentUuid:'student-008',batchUuid:'batch-003',status:2,remark:'事假',recordedAt:'2026-11-21 10:12'},{uuid:'att-008',studentUuid:'student-009',batchUuid:'batch-003',status:1,remark:'',recordedAt:'2026-11-21 10:12'}]};
    let db=JSON.parse(localStorage.getItem(KEY)||'null')||seed;let currentView='overview';const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const uid=p=>`${p}-${Date.now()}-${Math.random().toString(16).slice(2,7)}`;const persist=()=>localStorage.setItem(KEY,JSON.stringify(db));const courseOf=id=>db.courses.find(c=>c.uuid===id);const studentOf=id=>db.students.find(s=>s.uuid===id);const batchOf=id=>db.batches.find(b=>b.uuid===id);const initials=n=>String(n||'学').slice(0,2);const statusText={1:'已到',2:'请假',3:'缺勤'};const statusClass={1:'status-1',2:'status-2',3:'status-3'};
    function toast(msg){const el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),1800)}function counts(){return{students:db.students.length,courses:db.courses.length,leave:db.attendance.filter(a=>a.status===2).length,absent:db.attendance.filter(a=>a.status===3).length}}function pageMeta(){const m={overview:['课堂概览','查看课程、点名批次和近期考勤情况'],courses:['课程管理','一个教师可以维护多门课程和各自的学生名单'],students:['学生信息','学生姓名只维护一份，修改后会同步到所有相关记录'],batches:['点名批次','按课程创建点名批次，保留每次点名的上下文'],attendance:['考勤记录','记录已到、请假和缺勤，支持备注与追溯'],er:['数据结构 ER 图','当前页面数据对应的五张核心业务表']};return m[currentView]}
    function render(){const m=pageMeta();$('pageTitle').textContent=m[0];$('pageSubtitle').textContent=m[1];document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===currentView));const fn={overview:renderOverview,courses:renderCourses,students:renderStudents,batches:renderBatches,attendance:renderAttendance,er:renderER}[currentView];$('appView').innerHTML=fn();bindView();persist()}
    function renderOverview(){const c=counts();const courseCards=db.courses.map(course=>{const students=db.students.filter(s=>s.courseUuid===course.uuid).length,batches=db.batches.filter(b=>b.courseUuid===course.uuid).length;return `<div class="course-card"><div class="course-top"><div><div class="course-code">${esc(course.courseNo)}</div><h3>${esc(course.name)}</h3></div><span class="badge mint">${students} 名学生</span></div><div class="course-meta"><b>${esc(course.semester)}</b> · ${esc(course.schedule)}<br/>${esc(course.classroom)} · 已建 ${batches} 个点名批次</div></div>`}).join('');const recent=db.attendance.slice().sort((a,b)=>b.recordedAt.localeCompare(a.recordedAt)).slice(0,5).map(a=>{const s=studentOf(a.studentUuid),batch=batchOf(a.batchUuid),course=batch&&courseOf(batch.courseUuid);return `<div class="list-row"><div><strong>${esc(s?.name||'未知学生')}</strong><small>${esc(course?.name||'未知课程')} · ${esc(batch?.name||'未知批次')}</small></div><div class="list-right ${statusClass[a.status]}">${statusText[a.status]}<br/><span>${esc(a.recordedAt.slice(0,10))}</span></div></div>`}).join('');return `<div class="view"><div class="cards"><div class="card metric mint"><label>在册学生</label><strong>${c.students}</strong><span>学生信息表</span></div><div class="card metric"><label>负责课程</label><strong>${c.courses}</strong><span>教师 ${esc(db.teacher.name)}</span></div><div class="card metric yellow"><label>请假记录</label><strong>${c.leave}</strong><span>状态 = 2</span></div><div class="card metric red"><label>缺勤记录</label><strong>${c.absent}</strong><span>状态 = 3</span></div></div><div class="grid-2"><section class="card section"><div class="section-head"><div><h2>我的课程</h2><p>教师 → 课程 → 学生</p></div><button class="ghost" data-action="go-courses">管理课程</button></div><div class="course-grid">${courseCards||'<div class="empty">还没有课程</div>'}</div></section><section class="card section"><div class="section-head"><div><h2>近期考勤</h2><p>最新记录</p></div><button class="ghost" data-action="go-attendance">查看全部</button></div><div class="list">${recent||'<div class="empty">还没有考勤记录</div>'}</div></section></div><section class="card section"><div class="section-head"><div><h2>快速操作</h2><p>从业务表结构出发，先创建课程或点名批次</p></div></div><div class="toolbar"><button class="primary" data-action="new-batch">＋ 新建点名批次</button><button class="ghost" data-action="new-student">＋ 添加学生</button><button class="ghost" data-action="new-attendance">＋ 记录考勤</button><button class="ghost" data-action="go-er">查看 ER 图</button></div></section></div>`}
    function renderCourses(){const cards=db.courses.map(c=>{const n=db.students.filter(s=>s.courseUuid===c.uuid).length,b=db.batches.filter(x=>x.courseUuid===c.uuid).length;return `<div class="course-card"><div class="course-top"><div><div class="course-code">${esc(c.courseNo)}</div><h3>${esc(c.name)}</h3></div><span class="badge ${b?'mint':''}">${b} 个批次</span></div><div class="course-meta"><b>学期：</b>${esc(c.semester)}<br/><b>时间：</b>${esc(c.schedule)}<br/><b>地点：</b>${esc(c.classroom)}<br/><b>学生：</b>${n} 人</div><div class="toolbar" style="margin-top:14px"><button class="ghost" data-action="edit-course" data-id="${c.uuid}">编辑课程</button><button class="ghost" data-action="new-batch" data-course="${c.uuid}">新建批次</button></div></div>`}).join('');return `<div class="view"><div class="view-title"><div><h2>课程管理</h2><p>教师 ${esc(db.teacher.name)} 当前负责 ${db.courses.length} 门课程</p></div><button class="primary" data-action="new-course">＋ 新建课程</button></div><section class="card section"><div class="course-grid">${cards||'<div class="empty">还没有课程，请先新建课程</div>'}</div></section></div>`}
    function renderStudents(){return `<div class="view"><div class="view-title"><div><h2>学生信息</h2><p>修改姓名会影响所有课程名单和历史考勤记录</p></div><button class="primary" data-action="new-student">＋ 添加学生</button></div><section class="card section"><div class="section-head"><div><h2>学生列表</h2><p>${db.students.length} 位学生 · 通过学生 uuid 关联课程和考勤</p></div><div class="toolbar"><label class="search"><span>⌕</span><input id="studentSearch" placeholder="搜索姓名、学号…" /></label><select id="studentCourseFilter"><option value="">全部课程</option>${db.courses.map(c=>`<option value="${c.uuid}">${esc(c.name)}</option>`).join('')}</select></div></div><div class="table-wrap"><table class="table"><thead><tr><th>学生</th><th>学号</th><th>所属课程</th><th>手机号</th><th>请假次数</th><th>缺勤次数</th><th>操作</th></tr></thead><tbody id="studentRows">${studentRows(db.students)}</tbody></table></div></section></div>`}
    function studentRows(list){if(!list.length)return '<tr><td colspan="7"><div class="empty">没有符合条件的学生</div></td></tr>';return list.map(s=>{const leave=db.attendance.filter(a=>a.studentUuid===s.uuid&&a.status===2).length,absent=db.attendance.filter(a=>a.studentUuid===s.uuid&&a.status===3).length,c=courseOf(s.courseUuid);return `<tr><td><div class="name-cell"><div class="name-avatar">${esc(initials(s.name))}</div><div><strong>${esc(s.name)}</strong><small>uuid：${esc(s.uuid)}</small></div></div></td><td>${esc(s.studentNo)}</td><td>${esc(c?.name||'未分配')}</td><td>${esc(s.phone||'—')}</td><td><span class="badge yellow">${leave}</span></td><td><span class="badge red">${absent}</span></td><td class="actions"><button class="ghost" data-action="edit-student" data-id="${s.uuid}">改名/编辑</button></td></tr>`}).join('')}
    function renderBatches(){const cards=db.batches.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(b=>{const c=courseOf(b.courseUuid),records=db.attendance.filter(a=>a.batchUuid===b.uuid),arr=records.filter(a=>a.status===1).length,leave=records.filter(a=>a.status===2).length,absent=records.filter(a=>a.status===3).length;return `<article class="batch"><div class="batch-top"><div><span class="badge mint">${esc(b.mode||'随机点名')}</span><h3>${esc(b.name)}</h3></div><span class="badge">${esc(b.status||'已完成')}</span></div><p>${esc(c?.name||'未知课程')} · ${esc(b.date)}<br/>批次 uuid：${esc(b.uuid)}</p><div class="batch-stats"><div><b>${arr}</b>已到</div><div><b class="status-2">${leave}</b>请假</div><div><b class="status-3">${absent}</b>缺勤</div></div><div class="toolbar" style="margin-top:14px"><button class="ghost" data-action="new-attendance" data-batch="${b.uuid}">补录考勤</button></div></article>`}).join('');return `<div class="view"><div class="view-title"><div><h2>点名批次</h2><p>课程 → 点名批次 → 考勤记录</p></div><button class="primary" data-action="new-batch">＋ 新建点名批次</button></div><section class="card section"><div class="batch-grid">${cards||'<div class="empty">还没有点名批次，请先新建</div>'}</div></section></div>`}
    function renderAttendance(){const rows=db.attendance.slice().sort((a,b)=>b.recordedAt.localeCompare(a.recordedAt)).map(a=>{const s=studentOf(a.studentUuid),b=batchOf(a.batchUuid),c=b&&courseOf(b.courseUuid);return `<tr><td>${esc(a.recordedAt)}</td><td><strong>${esc(s?.name||'未知学生')}</strong><small>${esc(s?.studentNo||'')}</small></td><td>${esc(c?.name||'未知课程')}</td><td>${esc(b?.name||'未知批次')}</td><td><span class="badge ${a.status===1?'mint':a.status===2?'yellow':'red'}">${a.status} · ${statusText[a.status]}</span></td><td>${esc(a.remark||'—')}</td><td class="actions"><button class="ghost" data-action="edit-attendance" data-id="${a.uuid}">编辑</button></td></tr>`}).join('');return `<div class="view"><div class="view-title"><div><h2>考勤记录</h2><p>状态：1 = 已到，2 = 请假，3 = 缺勤</p></div><button class="primary" data-action="new-attendance">＋ 记录考勤</button></div><section class="card section"><div class="section-head"><div><h2>全部记录</h2><p>请假和缺勤次数均从考勤记录实时统计</p></div><div class="toolbar"><select id="attendanceCourse"><option value="">全部课程</option>${db.courses.map(c=>`<option value="${c.uuid}">${esc(c.name)}</option>`).join('')}</select><select id="attendanceStatus"><option value="">全部状态</option><option value="1">已到</option><option value="2">请假</option><option value="3">缺勤</option></select></div></div><div class="table-wrap"><table class="table"><thead><tr><th>记录时间</th><th>学生</th><th>课程</th><th>点名批次</th><th>状态</th><th>备注</th><th>操作</th></tr></thead><tbody id="attendanceRows">${rows||'<tr><td colspan="7"><div class="empty">还没有考勤记录</div></td></tr>'}</tbody></table></div></section></div>`}
    function renderER(){return `<div class="view"><div class="view-title"><div><h2>数据结构 ER 图</h2><p>当前页面数据对应图片中的五张核心业务表</p></div><span class="badge mint">教师端私有数据模型</span></div><section class="card section"><div class="er-shell"><svg class="er-svg" viewBox="0 0 1100 610" role="img" aria-label="教师端考勤系统实体关系图"><defs><marker id="erArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#7e9ab8"/></marker></defs><path class="er-line" marker-end="url(#erArrow)" d="M230 220 H370"/><path class="er-line" marker-end="url(#erArrow)" d="M650 220 H790"/><path class="er-line" marker-end="url(#erArrow)" d="M510 365 V445"/><path class="er-line" marker-end="url(#erArrow)" d="M920 300 V445"/><path class="er-line" marker-end="url(#erArrow)" d="M230 500 H430"/><path class="er-line" marker-end="url(#erArrow)" d="M790 500 H650"/><text class="er-label" x="300" y="202">教授</text><text class="er-label" x="720" y="202">包含学生</text><text class="er-label" x="540" y="420">产生点名批次</text><text class="er-label" x="970" y="395">对应考勤</text><text class="er-label" x="330" y="480">生成考勤记录</text><text class="er-label" x="720" y="480">生成考勤记录</text><text class="er-card" x="245" y="210">1</text><text class="er-card" x="350" y="210">N</text><text class="er-card" x="665" y="210">1</text><text class="er-card" x="770" y="210">N</text><text class="er-card" x="530" y="385">1</text><text class="er-card" x="530" y="438">N</text><text class="er-card" x="940" y="320">1</text><text class="er-card" x="940" y="438">N</text><text class="er-card" x="250" y="470">1</text><text class="er-card" x="410" y="470">N</text><text class="er-card" x="770" y="470">1</text><text class="er-card" x="670" y="470">N</text>${erBox(30,140,200,160,'教师',['Uuid PK','教师工号','教师姓名','密码','邮箱'])}${erBox(370,140,280,180,'课程',['Uuid PK','教师 uuid FK','课程序号','课程名称'])}${erBox(790,140,260,180,'学生',['Uuid PK','课程 uuid FK','学号','姓名','手机号'])}${erBox(390,445,240,130,'点名批次',['Uuid PK','课程 uuid FK','批次名称'])}${erBox(790,445,280,140,'考勤记录',['Uuid PK','学生 uuid FK','点名批次 uuid FK','状态：1 已到 / 2 请假 / 3 缺勤','备注'])}</svg></div><p class="schema-note">学生姓名只维护在“学生”实体中；课程、点名批次和考勤记录均通过 uuid 关联。修改姓名后，所有页面显示都会同步更新。</p></section></div>`}
    function erBox(x,y,w,h,title,fields){return `<g><rect class="er-box" x="${x}" y="${y}" width="${w}" height="${h}" rx="10"/><rect class="er-head" x="${x}" y="${y}" width="${w}" height="42" rx="10"/><rect class="er-head" x="${x}" y="${y+25}" width="${w}" height="17"/><text class="er-title" x="${x+w/2}" y="${y+28}">${title}</text>${fields.map((f,i)=>`<text class="${f.includes('PK')||f.includes('FK')?'er-key':'er-field'}" x="${x+15}" y="${y+66+i*21}">${f}</text>`).join('')}</g>`}
    function openModal(type,id){let title='',sub='',body='';if(type==='student'){const s=id&&studentOf(id)||{studentNo:'',name:'',phone:'',courseUuid:db.courses[0]?.uuid||''};title=id?'编辑学生信息':'添加学生';sub='修改姓名会同步影响所有关联考勤记录';body=`<form id="modalForm"><div class="form-grid"><div class="field"><label>学号</label><input name="studentNo" required value="${esc(s.studentNo)}"/></div><div class="field"><label>手机号</label><input name="phone" value="${esc(s.phone)}"/></div><div class="field full"><label>姓名</label><input name="name" required value="${esc(s.name)}"/></div><div class="field full"><label>所属课程</label><select name="courseUuid">${db.courses.map(c=>`<option value="${c.uuid}" ${c.uuid===s.courseUuid?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div></div><div class="modal-actions"><button type="button" class="ghost" data-close>取消</button><button class="primary">保存</button></div></form>`}else if(type==='course'){const c=id&&courseOf(id)||{courseNo:'',name:'',semester:'2026 春',classroom:'',schedule:''};title=id?'编辑课程':'新建课程';sub='课程属于当前教师，可独立创建点名批次';body=`<form id="modalForm"><div class="form-grid"><div class="field"><label>课程序号</label><input name="courseNo" required value="${esc(c.courseNo)}"/></div><div class="field"><label>学期</label><input name="semester" required value="${esc(c.semester)}"/></div><div class="field full"><label>课程名称</label><input name="name" required value="${esc(c.name)}"/></div><div class="field"><label>教室</label><input name="classroom" value="${esc(c.classroom)}"/></div><div class="field"><label>上课时间</label><input name="schedule" value="${esc(c.schedule)}"/></div></div><div class="modal-actions"><button type="button" class="ghost" data-close>取消</button><button class="primary">保存课程</button></div></form>`}else if(type==='batch'){const b={courseUuid:db.courses[0]?.uuid||'',name:'',date:new Date().toISOString().slice(0,10),mode:'随机点名'};title='新建点名批次';sub='点名批次属于某一门课程，考勤记录通过批次关联';body=`<form id="modalForm"><div class="form-grid"><div class="field full"><label>所属课程</label><select name="courseUuid">${db.courses.map(c=>`<option value="${c.uuid}" ${c.uuid===b.courseUuid?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field full"><label>批次名称</label><input name="name" required value="" placeholder="例如：第 9 次课点名"/></div><div class="field"><label>点名日期</label><input type="date" name="date" required value="${b.date}"/></div><div class="field"><label>点名方式</label><select name="mode"><option>随机点名</option><option>按顺序</option></select></div></div><div class="modal-actions"><button type="button" class="ghost" data-close>取消</button><button class="primary">创建批次</button></div></form>`}else if(type==='attendance'){const a={studentUuid:db.students[0]?.uuid||'',batchUuid:db.batches[0]?.uuid||'',status:1,remark:''};title='记录考勤';sub='状态值与图片中的数据结构保持一致：1 已到，2 请假，3 缺勤';body=`<form id="modalForm"><div class="form-grid"><div class="field full"><label>学生</label><select name="studentUuid">${db.students.map(s=>`<option value="${s.uuid}" ${s.uuid===a.studentUuid?'selected':''}>${esc(s.name)} · ${esc(s.studentNo)}</option>`).join('')}</select></div><div class="field full"><label>点名批次</label><select name="batchUuid">${db.batches.map(b=>`<option value="${b.uuid}" ${b.uuid===a.batchUuid?'selected':''}>${esc(b.name)} · ${esc(courseOf(b.courseUuid)?.name||'')}</option>`).join('')}</select></div><div class="field"><label>状态</label><select name="status"><option value="1">1 · 已到</option><option value="2">2 · 请假</option><option value="3">3 · 缺勤</option></select></div><div class="field"><label>备注</label><input name="remark" placeholder="可选"/></div></div><div class="modal-actions"><button type="button" class="ghost" data-close>取消</button><button class="primary">保存记录</button></div></form>`}$('modalRoot').innerHTML=`<div class="modal-back"><div class="modal"><div class="modal-head"><div><h2>${title}</h2><p>${sub}</p></div><button class="close" data-close>×</button></div>${body}</div></div>`;const form=$('modalForm');form?.addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(form);if(type==='student'){const data={studentNo:fd.get('studentNo').trim(),name:fd.get('name').trim(),phone:fd.get('phone').trim(),courseUuid:fd.get('courseUuid')};if(id)Object.assign(studentOf(id),data);else db.students.push({uuid:uid('student'),...data});toast(id?'学生信息已更新，姓名已同步':'学生已加入课程名单')}else if(type==='course'){const data={courseNo:fd.get('courseNo').trim(),name:fd.get('name').trim(),semester:fd.get('semester').trim(),classroom:fd.get('classroom').trim(),schedule:fd.get('schedule').trim(),teacherUuid:db.teacher.uuid};if(id)Object.assign(courseOf(id),data);else db.courses.push({uuid:uid('course'),...data});toast(id?'课程已更新':'课程已创建')}else if(type==='batch'){db.batches.push({uuid:uid('batch'),courseUuid:fd.get('courseUuid'),name:fd.get('name').trim(),date:fd.get('date'),mode:fd.get('mode'),status:'已完成'});toast('点名批次已创建')}else if(type==='attendance'){db.attendance.push({uuid:uid('attendance'),studentUuid:fd.get('studentUuid'),batchUuid:fd.get('batchUuid'),status:Number(fd.get('status')),remark:fd.get('remark').trim(),recordedAt:new Date().toLocaleString('zh-CN',{hour12:false}).slice(0,16)});toast('考勤记录已保存')}$('modalRoot').innerHTML='';render()})}
    function bindView(){document.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',()=>{const a=el.dataset.action,id=el.dataset.id;if(a==='new-student'||a==='edit-student')openModal('student',id);if(a==='new-course'||a==='edit-course')openModal('course',id);if(a==='new-batch')openModal('batch');if(a==='new-attendance'||a==='edit-attendance')openModal('attendance',id);if(a==='go-courses'){currentView='courses';render()}if(a==='go-attendance'){currentView='attendance';render()}if(a==='go-er'){currentView='er';render()}}));document.querySelectorAll('[data-close]').forEach(el=>el.addEventListener('click',()=>{$('modalRoot').innerHTML=''}));const ss=$('studentSearch'),sc=$('studentCourseFilter');function filterStudents(){let list=db.students.slice(),q=(ss?.value||'').trim().toLowerCase();if(q)list=list.filter(s=>s.name.toLowerCase().includes(q)||s.studentNo.toLowerCase().includes(q));if(sc?.value)list=list.filter(s=>s.courseUuid===sc.value);const rows=$('studentRows');if(rows)rows.innerHTML=studentRows(list)}ss?.addEventListener('input',filterStudents);sc?.addEventListener('change',filterStudents);const ac=$('attendanceCourse'),as=$('attendanceStatus');function filterAttendance(){let list=db.attendance.slice().sort((a,b)=>b.recordedAt.localeCompare(a.recordedAt));if(ac?.value)list=list.filter(a=>batchOf(a.batchUuid)?.courseUuid===ac.value);if(as?.value)list=list.filter(a=>String(a.status)===as.value);const rows=$('attendanceRows');if(rows)rows.innerHTML=list.map(a=>{const s=studentOf(a.studentUuid),b=batchOf(a.batchUuid),c=b&&courseOf(b.courseUuid);return `<tr><td>${esc(a.recordedAt)}</td><td><strong>${esc(s?.name||'未知学生')}</strong><small>${esc(s?.studentNo||'')}</small></td><td>${esc(c?.name||'未知课程')}</td><td>${esc(b?.name||'未知批次')}</td><td><span class="badge ${a.status===1?'mint':a.status===2?'yellow':'red'}">${a.status} · ${statusText[a.status]}</span></td><td>${esc(a.remark||'—')}</td><td class="actions"><button class="ghost" data-action="edit-attendance" data-id="${a.uuid}">编辑</button></td></tr>`}).join('')||'<tr><td colspan="7"><div class="empty">没有符合条件的记录</div></td></tr>';bindView()}ac?.addEventListener('change',filterAttendance);as?.addEventListener('change',filterAttendance)}
    $('nav').addEventListener('click',e=>{const b=e.target.closest('button[data-view]');if(!b)return;currentView=b.dataset.view;render()});$('globalAdd').addEventListener('click',()=>{const t={overview:'batch',courses:'course',students:'student',batches:'batch',attendance:'attendance'}[currentView];if(t)openModal(t);else toast('ER 图为只读结构视图')});persist();render();
  </script>
</body>
</html>
