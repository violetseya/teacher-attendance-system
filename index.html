    /* 明亮教学主题 */

ckground:#f8fbff;border-color:#d8e3f0}.er-box h3{color:#177fe3}.table td{border-color:#e3ebf4}.list-row{background:#f8fbff}.danger{background:#fff1f3;border-color:#ffd4da;color:#c94354}.center-layer{position:fixed;inset:0;z-index:75;display:grid;place-items:center;pointer-events:none;opacity:0;visibility:hidden;transition:.22s}.center-layer.show{opacity:1;visibility:visible}.center-layer:before{content:"";position:absolute;inset:0;background:rgba(39,65,96,.24)}.center-card{position:relative;z-index:1;width:min(520px,calc(100% - 38px));padding:28px 30px;border-radius:22px;text-align:center;background:rgba(255,255,255,.97);box-shadow:0 22px 70px rgba(33,68,112,.26);border:1px solid #d7e4f5;transform:translateY(8px) scale(.96);transition:.28s}.center-layer.show .center-card{transform:translateY(0) scale(1)}.notice-card{font-size:25px;font-weight:900;color:#1d5fba;letter-spacing:.03em}.egg-card{max-width:440px;padding:25px}.egg-icon{font-size:86px;line-height:1;display:block;animation:eggBounce .55s ease-in-out infinite alternate,eggSpin 1.8s ease-in-out infinite}.egg-title{font-size:26px;font-weight:900;color:#c94254;margin:12px 0 7px}.egg-text{color:#52667e;font-size:14px;line-height:1.6}@keyframes eggBounce{to{transform:translateY(-10px) scale(1.08)}}@keyframes eggSpin{50%{rotate:-10deg}100%{rotate:10deg}}@media(max-width:720px){.notice-card{font-size:21px}.egg-icon{font-size:70px}.egg-title{font-size:22px}}
    /* 缺勤彩蛋采用更轻的玻璃质感，背景内容仍清晰可见 */
    #eggLayer:before{background:rgba(39,65,96,.10)}#eggLayer .egg-card{background:rgba(255,255,255,.76);border-color:rgba(215,228,245,.72);box-shadow:0 18px 52px rgba(33,68,112,.14);backdrop-filter:blur(5px)}.quick-panel{overflow:hidden;position:relative}.quick-panel:after{content:"";position:absolute;width:210px;height:210px;right:-72px;bottom:-95px;border-radius:50%;background:radial-gradient(circle,rgba(23,127,227,.15),transparent 68%);pointer-events:none}.quick-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin:19px 0}.quick-step{position:relative;z-index:1;padding:14px;border:1px solid #dce7f4;border-radius:13px;background:#f8fbff}.quick-step b{display:block;color:#177fe3;font-size:18px;margin-bottom:7px}.quick-step span{font-size:12px;color:#62748a;line-height:1.5}.quick-footer{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 14px;border-radius:12px;background:#eef6ff;color:#52708f;font-size:12px}.quick-footer strong{color:#2a4c70}.quick-footer button{flex:none}.rollcall-card{position:relative}.rollcall-feedback{position:absolute;inset:0;z-index:4;display:grid;place-items:center;pointer-events:none;background:rgba(255,255,255,.72);border-radius:inherit;color:#177fe3;font-size:clamp(22px,3.2vw,34px);font-weight:900;letter-spacing:.04em;animation:feedbackIn .18s ease-out}@keyframes feedbackIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}.points{font-weight:900;color:#177fe3}@media(max-width:720px){.quick-steps{grid-template-columns:1fr}.quick-footer{align-items:flex-start;flex-direction:column}.rollcall-feedback{font-size:22px}}

  <div id="loginScreen" class="login-screen"><form id="loginForm" class="login-card"><div class="brand-mark">考</div><h1>教师登录</h1><p>账号和密码均可使用英文、数字及常用简单符号。</p><div class="login-form"><div class="field"><label>账号</label><input id="loginAccount" required placeholder="例如 teacher2026 或 Lin_01" autocomplete="username" /></div><div class="field"><label>密码</label><input id="loginPassword" required type="password" placeholder="可输入英文、数字或简单符号" autocomplete="current-password" /></div><button class="primary" type="submit">登录并进入系统</button></div></form></div>

  <script>
    const KEY='teacher-attendance-structure-v1'; const $=id=>document.getElementById(id); const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); const uid=p=>`${p}-${Date.now()}-${Math.random().toString(16).slice(2,7)}`; const statusText={1:'已到',2:'请假',3:'缺勤'};
    const defaultDb={teacher:{uuid:'teacher-001',teacherNo:'T2026001',name:'林老师',email:'teacher@example.com'},courses:[{uuid:'course-101',teacherUuid:'teacher-001',courseNo:'MATH-101',name:'高等数学 A',semester:'2026 春',classroom:'A302',schedule:'周二 08:00—09:40'},{uuid:'course-102',teacherUuid:'teacher-001',courseNo:'DATA-201',name:'数据结构',semester:'2026 春',classroom:'B201',schedule:'周三 14:00—15:40'}],students:[{uuid:'student-001',courseUuid:'course-101',studentNo:'20260001',name:'陈同学',phone:'13800000001'},{uuid:'student-002',courseUuid:'course-101',studentNo:'20260002',name:'李同学',phone:'13800000002'},{uuid:'student-003',courseUuid:'course-101',studentNo:'20260003',name:'王同学',phone:'13800000003'},{uuid:'student-004',courseUuid:'course-101',studentNo:'20260004',name:'赵同学',phone:'13800000004'},{uuid:'student-005',courseUuid:'course-102',studentNo:'20260005',name:'孙同学',phone:'13800000005'},{uuid:'student-006',courseUuid:'course-102',studentNo:'20260006',name:'周同学',phone:'13800000006'}],batches:[{uuid:'batch-001',courseUuid:'course-101',name:'第 8 次课点名',date:'2026-11-24',mode:'随机点名',status:'已完成'},{uuid:'batch-002',courseUuid:'course-102',name:'第 7 次课点名',date:'2026-11-23',mode:'按顺序',status:'已完成'}],attendance:[{uuid:'att-001',studentUuid:'student-001',batchUuid:'batch-001',status:1,remark:'',recordedAt:'2026-11-24 08:16'},{uuid:'att-002',studentUuid:'student-002',batchUuid:'batch-001',status:2,remark:'病假',recordedAt:'2026-11-24 08:16'},{uuid:'att-003',studentUuid:'student-003',batchUuid:'batch-001',status:3,remark:'未到课',recordedAt:'2026-11-24 08:16'}]};

    const eggs=[['🦆','小黄鸭巡逻中','缺勤雷达已锁定，电子小黄鸭正认真查看座位。'],['🛸','时空传送未成功','该同学可能还在尝试从另一个教室瞬移过来。'],['🐧','企鹅送来便签','便签上写着：下节课记得带上本人。'],['📡','课堂信号搜索中','已向宇宙发出“请回到课堂”的友好讯号。'],['🦸','迟到超人待命','披风可能卡在路上了，我们先登记缺勤。']];let eggDeck=[],lastEgg=-1;function toast(msg){const e=$('toast');e.style.left='50%';e.textContent=msg;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2100)}function rollcallToast(msg){toast(msg);const card=document.querySelector('.rollcall-card');if(card){const box=card.getBoundingClientRect();$('toast').style.left=`${box.left+box.width/2}px`}}function centerNotice(msg){const layer=$('noticeLayer');$('noticeText').textContent=msg;layer.classList.add('show');clearTimeout(centerNotice.t);centerNotice.t=setTimeout(()=>layer.classList.remove('show'),2600)}function drawEgg(){if(!eggDeck.length){eggDeck=eggs.map((_,i)=>i).sort(()=>Math.random()-.5);if(eggDeck.length>1&&eggDeck[0]===lastEgg){const swap=eggDeck.findIndex(i=>i!==lastEgg);[eggDeck[0],eggDeck[swap]]=[eggDeck[swap],eggDeck[0]]}}const index=eggDeck.shift();lastEgg=index;return eggs[index]}function showAbsenceEgg(){const [icon,title,text]=drawEgg(),layer=$('eggLayer');$('eggCard').innerHTML=`<span class="egg-icon">${icon}</span><div class="egg-title">${title}</div><div class="egg-text">${text}</div>`;layer.classList.add('show');clearTimeout(showAbsenceEgg.t);showAbsenceEgg.t=setTimeout(()=>layer.classList.remove('show'),1600)}function closeModal(){$('modalRoot').innerHTML=''}function confirmAction(title,message,onConfirm){$('modalRoot').innerHTML=`<div class="modal-back"><div class="modal"><div class="modal-head"><div><h2>${esc(title)}</h2><p>${esc(message)}</p></div><button class="close" data-close>×</button></div><div class="modal-actions"><button class="ghost" data-close>取消</button><button class="danger" id="confirmDelete">确认删除</button></div></div></div>`;$('confirmDelete').onclick=()=>{closeModal();onConfirm()}}function csvValue(v){return `"${String(v??'').replac     function openInsertModal(){if(!rollcall)return;const ids=rollcall.queue.slice(rollcall.pos+1);if(!ids.length){toast('后面没有可插入的学生');return}$('modalRoot').innerHTML=`<div class="modal-back"><div class="modal"><div class="modal-head"><div><h2>插号</h2><p>选择一位尚未点到的学生，插入到下一位。</p></div><button class="close" data-close>×</button></div><form id="insertForm"><div class="field"><label>学生</label><select name="studentUuid">${ids.map(id=>{const s=studentOf(id);return `<option value="${id}">${esc(s?.name||'')} · ${esc(s?.studentNo||'')}</option>`}).join('')}</select></div><div class="modal-actions"><button type="button" class="ghost" data-close>取消</button><button class="primary">确认插号</button></div></form></div></div>`;$('insertForm').addEventListener('submit',e=>{e.preventDefault();const id=new FormData(e.currentTarget).get('studentUuid'),old=rollcall.queue.indexOf(id);rollcall.queue.splice(old,1);rollcall.queue.splice(rollcall.pos+1,0,id);closeModal();toast(`${studentOf(id)?.name||'该学生'} 已插入下一位`);render()})}
    function openModal(type,id,preferredCourse){let title='',body='';if(type==='student'){const s=id?studentOf(id):{studentNo:'',name:'',phone:'',courseUuid:db.courses[0]?.uuid||''};title=id?'编辑学生信息':'添加学生';body=`<div class="form-grid"><div class="field"><label>学号</label><input name="studentNo" required value="${esc(s.studentNo)}"></div><div class="field"><label>手机号</label><input name="phone" value="${esc(s.phone)}"></div><div class="field full"><label>姓名</label><input name="name" required value="${esc(s.name)}"></div><div class="field full"><label>所属课程</label><select name="courseUuid">${db.courses.map(c=>`<option value="${c.uuid}" ${c.uuid===s.courseUuid?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div></div>`}else if(type==='course'){const c=id?courseOf(id):{courseNo:'',name:'',semester:'2026 春',classroom:'',schedule:''};title=id?'编辑课程':'新建课程';body=`<div class="form-grid"><div class="field"><label>课程序号</label><input name="courseNo" required value="${esc(c.courseNo)}"></div><div class="field"><label>学期</label><input name="semester" required value="${esc(c.semester)}"></div><div class="field full"><label>课程名称</label><input name="name" required value="${esc(c.name)}"></div><div class="field"><label>教室</label><input name="classroom" value="${esc(c.classroom)}"></div><div class="field"><label>上课时间</label><input name="schedule" value="${esc(c.schedule)}"></div></div>`}else if(type==='batch'){const b={courseUuid:preferredCourse||db.courses[0]?.uuid||'',name:'',date:new Date().toISOString().slice(0,10),mode:'随机点名'};title='新建点名批次';body=`<div class="form-grid"><div class="field full"><label>所属课程</label><select name="courseUuid">${db.courses.map(c=>`<option value="${c.uuid}" ${c.uuid===b.courseUuid?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field full"><label>批次名称</label><input name="name" required placeholder="例如：第 9 次课点名"></div><div class="field"><label>点名日期</label><input type="date" name="date" required value="${b.date}"></div><div class="field"><label>点名方式</label><select name="mode"><option>随机点名</option><option>按顺序</option></select></div></div>`}else{const a=id?db.attendance.find(x=>x.uuid===id):{studentUuid:'',batchUuid:preferredCourse||db.batches[0]?.uuid||'',status:1,remark:''};title=id?'编辑考勤':'记录考勤';body=`<div class="form-grid"><div class="field full"><label>学生</label><select name="studentUuid">${db.students.map(s=>`<option value="${s.uuid}" ${s.uuid===a.studentUuid?'selected':''}>${esc(s.name)} · ${esc(s.studentNo)}</option>`).join('')}</select></div><div class="field full"><label>点名批次</label><select name="batchUuid">${db.batches.map(b=>`<option value="${b.uuid}" ${b.uuid===a.batchUuid?'selected':''}>${esc(b.name)}</option>`).join('')}</select></div><div class="field"><label>状态</label><select name="status">${[1,2,3].map(x=>`<option value="${x}" ${x===a.status?'selected':''}>${statusText[x]}</option>`).join('')}</select></div><div class="field"><label>备注</label><input name="remark" value="${esc(a.remark)}"></div></div>`}$('modalRoot').innerHTML=`<div class="modal-back"><div class="modal"><div class="modal-head"><div><h2>${title}</h2><p>取消按钮和关闭按钮均可正常退出本次编辑。</p></div><button class="close" data-close>×</button></div><form id="modalForm">${body}<div class="modal-actions"><button type="button" class="ghost" data-close>取消</button><button class="primary">保存</button></div></form></div></div>`;$('modalForm').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.currentTarget);if(type==='student'){const x={studentNo:f.get('studentNo').trim(),name:f.get('name').trim(),phone:f.get('phone').trim(),courseUuid:f.get('courseUuid')};id?Object.assign(studentOf(id),x):db.students.push({uuid:uid('student'),...x})}if(type==='course'){const x={courseNo:f.get('courseNo').trim(),name:f.get('name').trim(),semester:f.get('semester').trim(),classroom:f.get('classroom').trim(),schedule:f.get('schedule').trim(),teacherUuid:db.teacher.uuid};id?Object.assign(courseOf(id),x):db.courses.push({uuid:uid('course'),...x})}if(type==='batch')db.batches.push({uuid:uid('batch'),courseUuid:f.get('courseUuid'),name:f.get('name').trim(),date:f.get('date'),mode:f.get('mode'),status:'未开始'});if(type==='attendance'){const x={studentUuid:f.get('studentUuid'),batchUuid:f.get('batchUuid'),status:Number(f.get('status')),remark:f.get('remark').trim(),recordedAt:now()};id?Object.assign(db.attendance.find(a=>a.uuid===id),x):db.attendance.push({uuid:uid('attendance'),...x})}closeModal();persist();toast('已保存');render()})}
    function parseRows(text){const ls=text.replace(/^\uFEFF/,'').trim().split(/\r?\n/),sep=ls[0]?.includes('\t')?'\t':',';const h=ls.shift().split(sep).map(x=>x.trim().toLowerCase());return ls.filter(Boolean).map(l=>Object.fromEntries(l.split(sep).map(x=>x.trim()).map((x,i)=>[h[i],x])))} async function importFile(file,pinnedCourse=''){try{let rows=[];const ext=file.name.split('.').pop().toLowerCase();if(['xls','xlsx'].includes(ext)&&window.XLSX){const b=XLSX.read(await file.arrayBuffer(),{type:'array'});rows=XLSX.utils.sheet_to_json(b.Sheets[b.SheetNames[0]],{defval:''})}else if(ext==='json'){const x=JSON.parse(await file.text());rows=Array.isArray(x)?x:x.students||[]}else rows=parseRows(await file.text());const norm=rows.map(x=>({name:String(x['姓名']||x.name||x['学生姓名']||'').trim(),studentNo:String(x['学号']||x.studentno||x.id||'').trim(),phone:String(x['手机号']||x.phone||x.mobile||'').trim(),course:String(x['课程名称']||x.course||'').trim()})).filter(x=>x.name||x.studentNo);if(!norm.length){toast('没有识别到学生数据，请检查表头');return}openImportModal(norm,file.name,pinnedCourse)}catch(e){toast('文件读取失败，请检查格式')}} function openImportModal(rows,name,pinnedCourse=''){const fixed=courseOf(pinnedCourse);$('modalRoot').innerHTML=`<div class="modal-back"><div class="modal"><div class="modal-head"><div><h2>导入学生名单</h2><p>${esc(name)} · 识别到 ${rows.length} 行</p></div><button class="close" data-close>×</button></div><form id="importForm">${fixed?`<input type="hidden" name="courseUuid" value="${fixed.uuid}"><div class="field"><label>导入课程</label><input value="${esc(fixed.name)}" disabled></div>`:`<div class="field"><label>默认所属课程</label><select name="courseUuid">${db.courses.map(c=>`<option value="${c.uuid}">${esc(c.name)}</option>`).join('')}</select></div>`}<p class="schema-note">${fixed?`本次名单将全部归入“${esc(fixed.name)}”，不受表格中的课程列影响。`:'支持表头：姓名、学号、手机号、课程名称。相同学号会更新，新增学号会加入名单。'}</p><div class="modal-actions"><button type="button" class="ghost" data-close>取消</button><button class="primary">确认导入</button></div></form></div></div>`;$('importForm').addEventListener('submit',e=>{e.preventDefault();const def=new FormData(e.currentTarget).get('courseUuid');let add=0,upd=0;rows.forEach((x,i)=>{const c=fixed||db.courses.find(q=>q.name===x.course);const old=x.studentNo&&db.students.find(s=>s.studentNo===x.studentNo);if(old){Object.assign(old,{name:x.name||old.name,phone:x.phone||old.phone,courseUuid:c?.uuid||def});upd++}else if(x.name){db.students.push({uuid:uid('student'),studentNo:x.studentNo||`IMPORT-${Date.now()}-${i}`,name:x.name,phone:x.phone,courseUuid:c?.uuid||def});add++}});closeModal();persist();toast(`导入完成：${fixed?fixed.name+' ':''}新增 ${add} 人，更新 ${upd} 人`);render()})}
    function bindView(){
      document.querySelectorAll('[data-action]').forEach(el=>el.onclick=()=>{
        const a=el.dataset.action,id=el.dataset.id;
        if(a==='go-rollcall'){currentView='rollcall';render()}
        else if(a==='start-rollcall')startRollcall(el.dataset.batch);
        else if(a==='start-selected-rollcall')startRollcall($('rollcallBatch').value);
        else if(a==='next-student')nextStudent();
        else if(a==='replay-name')speakCurrent();
        else if(a==='insert-student')openInsertModal();
        else if(a==='cancel-rollcall'){if(confirm('确定取消本次点名吗？已经保存的考勤记录会保留。')){clearTimeout(autoAdvance);if('speechSynthesis' in window)window.speechSynthesis.cancel();rollcall=null;currentView='batches';render();toast('已取消点名，已保存记录不会丢失')}}
        else if(a==='finish-rollcall'){rollcall=null;currentView='batches';render()}
        else if(a==='import-students')$('studentFileInput').click();
        else if(a==='import-course-students'){window.pendingCourseImport=el.dataset.course;$('studentFileInput').click()}
        else if(a==='export-students')exportStudents();
        else if(a==='export-batch')exportBatch(el.dataset.batch);
        else if(a==='add-point'){const student=studentOf(id);if(student){student.points=Number(student.points||0)+1;persist();render();toast(`${student.name} 已加 1 分`)}}
        else if(a==='new-student'||a==='edit-student')openModal('student',id);
        else if(a==='new-course'||a==='edit-course')openModal('course',id);
        else if(a==='new-batch')openModal('batch',null,el.dataset.course);
        else if(a==='new-attendance'||a==='edit-attendance')openModal('attendance',id,el.dataset.batch);
        else if(a==='delete-student'){
          const student=studentOf(id),linked=db.attendance.filter(x=>x.studentUuid===id).length;
          if(student)confirmAction('删除学生',`确定删除“${student.name}”吗？关联的 ${linked} 条考勤记录也会一并删除。`,()=>{db.students=db.students.filter(x=>x.uuid!==id);db.attendance=db.attendance.filter(x=>x.studentUuid!==id);persist();render();toast('学生及关联考勤记录已删除')});
        }
        else if(a==='clear-students'){
          const n=db.students.length,r=db.attendance.length;
          if(n&&confirm(`确定清空全部 ${n} 名学生吗？关联的 ${r} 条考勤记录也会一并删除，且无法恢复。`)){
            db.students=[];db.attendance=[];persist();render();toast('全部学生和关联考勤记录已清空');
          }
        }
        else if(a==='delete-course'){
          const course=courseOf(id),studentIds=db.students.filter(x=>x.courseUuid===id).map(x=>x.uuid),batchIds=db.batches.filter(x=>x.courseUuid===id).map(x=>x.uuid),linked=db.attendance.filter(x=>studentIds.includes(x.studentUuid)||batchIds.includes(x.batchUuid)).length;
          if(course&&confirm(`确定删除课程“${course.name}”吗？该课程的 ${studentIds.length} 名学生、${batchIds.length} 个点名批次及 ${linked} 条考勤记录都会一并删除，且无法恢复。`)){
            db.courses=db.courses.filter(x=>x.uuid!==id);db.students=db.students.filter(x=>x.courseUuid!==id);db.batches=db.batches.filter(x=>x.courseUuid!==id);db.attendance=db.attendance.filter(x=>!studentIds.includes(x.studentUuid)&&!batchIds.includes(x.batchUuid));persist();render();toast('课程及关联数据已删除');
          }
        }
        else if(a==='clear-courses'){
          const n=db.courses.length,s=db.students.length,b=db.batches.length,r=db.attendance.length;
          if(n&&confirm(`确定清空全部 ${n} 门课程吗？其 ${s} 名学生、${b} 个点名批次和 ${r} 条考勤记录都会一并删除，且无法恢复。`)){
            db.courses=[];db.students=[];db.batches=[];db.attendance=[];persist();render();toast('全部课程及关联数据已清空');
          }
        }
        else if(a==='delete-attendance'){
          const item=db.attendance.find(x=>x.uuid===id),student=studentOf(item?.studentUuid);
          if(item&&confirm(`确定删除 ${student?.name||'该学生'} 的考勤记录吗？删除后无法恢复。`)){
            db.attendance=db.attendance.filter(x=>x.uuid!==id);persist();render();toast('考勤记录已删除');
          }
        }
        else if(a==='clear-attendance'){
          if(db.attendance.length&&confirm(`确定清空全部 ${db.attendance.length} 条考勤记录吗？此操作无法恢复。`)){
            db.attendance=[];persist();render();toast('全部考勤记录已清空');
          }
        }
        else if(a==='delete-batch'){
          const batch=batchOf(id),linked=db.attendance.filter(x=>x.batchUuid===id).length;
          if(batch&&confirm(`确定删除“${batch.name}”吗？关联的 ${linked} 条考勤记录也会一并删除，且无法恢复。`)){
            db.batches=db.batches.filter(x=>x.uuid!==id);db.attendance=db.attendance.filter(x=>x.batchUuid!==id);persist();render();toast('点名批次及关联考勤记录已删除');
          }
        }
        else if(a==='clear-batches'){
          const n=db.batches.length,r=db.attendance.length;
          if(n&&confirm(`确定清空全部 ${n} 个点名批次吗？关联的 ${r} 条考勤记录也会一并删除，且无法恢复。`)){
            db.batches=[];db.attendance=[];persist();render();toast('全部点名批次和关联记录已清空');
          }
        }
      });
      document.querySelectorAll('[data-roll-status]').forEach(el=>el.onclick=()=>recordStatus(Number(el.dataset.rollStatus)));
      $('studentFileInput')?.addEventListener('change',e=>{const f=e.target.files[0],pinned=window.pendingCourseImport||'';window.pendingCourseImport='';if(f)importFile(f,pinned);e.target.value=''});
      const search=$('studentSearch'),filter=$('studentCourseFilter');const update=()=>{let xs=db.students,q=(search?.value||'').trim().toLowerCase();if(q)xs=xs.filter(s=>s.name.toLowerCase().includes(q)||s.studentNo.toLowerCase().includes(q));if(filter?.value)xs=xs.filter(s=>s.courseUuid===filter.value);$('studentRows').innerHTML=studentRows(xs);bindView()};if(search)search.oninput=update;if(filter)filter.onchange=update
    }
    $('modalRoot').addEventListener('click',e=>{if(e.target.closest('[data-close]')||e.target.classList.contains('modal-back'))closeModal()});$('nav').addEventListener('click',e=>{const b=e.target.closest('button[data-view]');if(b){clearTimeout(autoAdvance);currentView=b.dataset.view;render()}});$('globalAdd').onclick=()=>openModal({overview:'batch',courses:'course',students:'student',batches:'batch',attendance:'attendance'}[currentView]||'batch');$('loginForm').addEventListener('submit',e=>{e.preventDefault();$('loginScreen').classList.add('hidden');toast('登录成功，欢迎进入教师端点名系统')});persist();render();
  </script>
</body>
</html>
